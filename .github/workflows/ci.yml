name: ThreadLore CI

on:
  push:
    branches: [main, develop, 'feat/**']
  pull_request:
    branches: [main, develop]

jobs:
  backend-quality:
    name: Backend Lint, Type Check & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run Ruff Lint
        run: ruff check backend/ scripts/

      - name: Run Mypy Type Check
        run: mypy backend/app/ scripts/

      - name: Run Handweaving WIF Compliance Verifier
        run: |
          python scripts/verify_wif_handweaving.py docs/assets/validation/Plain_Weave_Test.wif
          git show HEAD:docs/assets/validation/Plain_Weave_Test.wif | python scripts/verify_wif_handweaving.py -

      - name: Run Pytest Suite (All 49 unit and integration tests)
        run: pytest backend/tests/ -v

  frontend-quality:
    name: Frontend Type Check, Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript Type Check
        run: npm run lint

      - name: Run Frontend Tests (Vitest)
        run: npm test

      - name: Build Production Assets
        run: npm run build

  container-build:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: threadlore:ci
